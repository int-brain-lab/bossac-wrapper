[project]
name = "bossac-wrapper"
description = "A Python wrapper for bossac"
authors = [
  {name = "Florian Rau", email = "bimac@users.noreply.github.com"},
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["bossa", "bossac", "sam-ba", "atmel", "arduino", "firmware"]
dynamic = ["version"]
dependencies = [
  "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/int-brain-lab/bossac-wrapper/"
Documentation = "https://int-brain-lab.github.io/bossac-wrapper/"
Repository = "https://github.com/int-brain-lab/bossac-wrapper.git"
Issues = "https://github.com/int-brain-lab/bossac-wrapper/issues"
Changelog = "https://github.com/int-brain-lab/bossac-wrapper/blob/main/CHANGELOG.md"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "file"
path = "bossac/__init__.py"

[tool.pdm.build]
includes = ["bossac"]
source-includes = ["tests", "docs", "*.md"]
excludes = [".gitignore", "docs/build"]
run-setuptools = false
is-purelib = false

[tool.uv]
# reinstall when the version, the pinned bossac version or the build hook changes
cache-keys = [
  { file = "pyproject.toml" },
  { file = "pdm_build.py" },
  { file = "bossac/__init__.py" },
]

[tool.uv.dependency-groups]
doc = { requires-python = ">=3.14" }

[dependency-groups]
dev = [
  { include-group = "build" },
  { include-group = "doc" },
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typing" },
]
build = [
  "pdm-backend",
]
lint = [
  "ruff>=0.15.0",
]
typing = [
  "mypy>=1.10.1",
  "types-pyserial>=3.5",
]
test = [
  { include-group = "lint" },
  { include-group = "typing" },
  { include-group = "tox" },
  "pytest>=8.2.2",
  "pytest-cov>=5.0.0",
]
tox = [
  "tox>=4.25.0",
  "tox-uv>=1.11",
]
ci = [
  "coveralls>=4.0.1",
  "pytest-github-actions-annotate-failures>=0.3.0",
]
doc = [
  "sphinx>=8.0.0",
  "sphinx-autodoc-typehints>=3.10",
  "myst-parser>=3.0.1",
  "shibuya>=2026.7.12",
  "sphinx-llm>=1.1.0",
  "sphinx-sitemap>=2.9.0",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "D",    # pydocstyle
  "E501", # line-too-long, also for comments and docstrings
  "FBT",  # flake8-boolean-trap
  "ICN",  # flake8-import-conventions
  "SLF",  # flake8-self
  "T20",  # flake8-print
  "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["A001", "DTZ011"]  # names and values required by Sphinx
"pdm_build.py" = ["T201"]  # progress messages of the build hook
"tests/*.py" = ["ANN", "D", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["bossac"]

[tool.pytest.ini_options]
addopts    = "--cov=bossac"
minversion = "6.0"
testpaths  = [ "tests" ]
